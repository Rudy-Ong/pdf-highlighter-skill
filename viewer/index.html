<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PDF Highlighter</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
  :root {
    --bg: #f5f5f4; --panel: #ffffff; --text: #1c1917; --muted: #78716c; --line: #e7e5e4;
    --accent: #2563eb; --yellow: #ffd60a; --red: #ff5a5a; --green: #59cc66; --blue: #66b3ff; --purple: #bf8cff;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1c1917; --panel: #292524; --text: #f5f5f4; --muted: #a8a29e; --line: #44403c; --accent: #60a5fa; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  #app { display: grid; grid-template-columns: 360px 1fr; height: 100vh; }
  #side { background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
  #side header { padding: 12px; border-bottom: 1px solid var(--line); display: grid; gap: 8px; }
  select, input[type=search], textarea, button {
    font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; }
  select { width: 100%; }
  button { cursor: pointer; }
  button:hover { border-color: var(--accent); }
  .row { display: flex; gap: 6px; align-items: center; }
  .row > * { flex: 1; }
  .row > .fit { flex: 0 0 auto; }
  .dots { display: flex; gap: 6px; }
  .dot { width: 22px; height: 22px; border-radius: 50%; border: 2px solid transparent; padding: 0; flex: 0 0 22px; }
  .dot.on { border-color: var(--text); }
  #list { overflow-y: auto; padding: 8px; flex: 1; min-height: 0; }
  .pagehead { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; margin: 12px 4px 4px; }
  .card { border: 1px solid var(--line); border-left-width: 6px; border-radius: 6px; padding: 8px; margin-bottom: 8px; cursor: pointer; background: var(--bg); }
  .card.flash { outline: 2px solid var(--accent); }
  .card .t { margin: 0 0 6px; }
  .card textarea { width: 100%; min-height: 40px; resize: vertical; font-size: 13px; }
  .card .acts { display: flex; gap: 6px; align-items: center; margin-top: 6px; }
  .card .acts .dot { width: 16px; height: 16px; flex-basis: 16px; }
  .card .acts .sp { flex: 1; }
  .card .del { padding: 2px 8px; font-size: 12px; color: #dc2626; }
  .empty, #status { color: var(--muted); padding: 12px; }
  #status { border-top: 1px solid var(--line); padding: 6px 12px; font-size: 12px; }
  #viewer { overflow: auto; height: 100vh; padding: 16px 0 80px; position: relative; }
  .page { position: relative; margin: 0 auto 14px; background: #fff; box-shadow: 0 1px 6px rgba(0,0,0,.25); }
  .page canvas { display: block; }
  .textLayer { position: absolute; inset: 0; overflow: hidden; line-height: 1; opacity: 1; }
  .textLayer span, .textLayer br { color: transparent; position: absolute; white-space: pre; cursor: text; transform-origin: 0 0; }
  .textLayer ::selection { background: rgba(37, 99, 235, .35); }
  .flashbox { position: absolute; background: rgba(37, 99, 235, .25); outline: 2px solid var(--accent); pointer-events: none; border-radius: 2px; }
  #pop { position: fixed; display: none; z-index: 20; background: var(--panel); border: 1px solid var(--line);
    border-radius: 999px; padding: 6px 8px; box-shadow: 0 4px 14px rgba(0,0,0,.3); gap: 6px; }
  #pop.show { display: flex; }
  .toolbar { display: flex; gap: 6px; }
  .toolbar button { padding: 4px 10px; }
  @media (max-width: 820px) { #app { grid-template-columns: 1fr; grid-template-rows: 40vh 1fr; } #viewer { height: 60vh; } }
</style>
</head>
<body>
<div id="app">
  <aside id="side">
    <header>
      <select id="file" aria-label="PDF file"></select>
      <input id="q" type="search" placeholder="Filter highlights / notes…">
      <div class="row">
        <div class="dots" id="dots" title="Highlight colour"></div>
        <span class="fit" style="color:var(--muted);font-size:12px">colour for new highlights</span>
      </div>
      <div class="toolbar">
        <button id="zout" title="Zoom out">−</button>
        <button id="zin" title="Zoom in">+</button>
        <button id="fit" title="Fit width">Fit</button>
        <button id="exp" title="Export highlights as Markdown" style="margin-left:auto">Export .md</button>
      </div>
    </header>
    <div id="list"></div>
    <div id="status">Select text in the PDF, then choose a colour.</div>
  </aside>
  <main id="viewer"></main>
</div>
<div id="pop"></div>

<script>
"use strict";
const COLORS = {yellow: "#ffd60a", red: "#ff5a5a", green: "#59cc66", blue: "#66b3ff", purple: "#bf8cff"};
const $ = (s) => document.querySelector(s);
const state = {id: null, doc: null, scale: 1.3, color: "yellow", annots: [], pages: []};
pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

window.addEventListener("error", (e) => status("JS error: " + e.message));
window.addEventListener("unhandledrejection", (e) => status("Error: " + (e.reason && e.reason.message || e.reason)));
function status(msg) { $("#status").textContent = msg; }
async function api(url, opt) {
  const r = await fetch(url, opt);
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || r.statusText);
  return r.headers.get("content-type").includes("json") ? r.json() : r.text();
}
const post = (m, body) => api("/api/annots", {method: m, headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)});

function dotButtons(container, onPick, current) {
  container.innerHTML = "";
  for (const [name, hex] of Object.entries(COLORS)) {
    const b = document.createElement("button");
    b.className = "dot" + (name === current ? " on" : "");
    b.style.background = hex; b.title = name; b.type = "button";
    b.addEventListener("mousedown", (e) => e.preventDefault()); // keep the text selection alive
    b.addEventListener("click", (e) => { e.stopPropagation(); onPick(name); });
    container.appendChild(b);
  }
}
function renderPalette() {
  dotButtons($("#dots"), (c) => { state.color = c; renderPalette(); }, state.color);
}

/* ---------- loading ---------- */
async function loadFiles() {
  const files = await api("/api/pdfs");
  const sel = $("#file");
  sel.innerHTML = files.map((f) => `<option value="${encodeURIComponent(f.id)}">${f.name.replace(/</g, "&lt;")}</option>`).join("");
  const saved = localStorage.getItem("pdfhl.last");
  if (saved && files.some((f) => encodeURIComponent(f.id) === saved)) sel.value = saved;
  if (files.length) openPdf(decodeURIComponent(sel.value));
  else status("No PDFs found under the served folder.");
}

async function openPdf(id) {
  state.id = id; localStorage.setItem("pdfhl.last", encodeURIComponent(id));
  status("Loading…");
  const buf = await (await fetch("/pdf?id=" + encodeURIComponent(id) + "&t=" + Date.now())).arrayBuffer();
  state.doc = await pdfjsLib.getDocument({data: buf}).promise;
  await renderAll();
  await loadAnnots();
  status(`${state.doc.numPages} pages`);
}

async function renderAll(keepScroll) {
  const v = $("#viewer"), top = v.scrollTop;
  v.innerHTML = ""; state.pages = [];
  for (let n = 1; n <= state.doc.numPages; n++) {
    const page = await state.doc.getPage(n);
    const vp = page.getViewport({scale: state.scale});
    const div = document.createElement("div");
    div.className = "page"; div.dataset.page = n;
    div.style.width = vp.width + "px"; div.style.height = vp.height + "px";
    div.style.setProperty("--scale-factor", vp.scale);
    const canvas = document.createElement("canvas");
    const dpr = window.devicePixelRatio || 1;
    canvas.width = vp.width * dpr; canvas.height = vp.height * dpr;
    canvas.style.width = vp.width + "px"; canvas.style.height = vp.height + "px";
    const tl = document.createElement("div"); tl.className = "textLayer";
    div.append(canvas, tl); v.appendChild(div);
    state.pages[n] = div;
    // render lazily when visible
    new IntersectionObserver((es, ob) => {
      if (!es[0].isIntersecting) return; ob.disconnect();
      page.render({canvasContext: canvas.getContext("2d"), viewport: vp, transform: dpr !== 1 ? [dpr, 0, 0, dpr, 0, 0] : null});
      page.getTextContent().then((tc) => pdfjsLib.renderTextLayer({textContentSource: tc, textContent: tc, container: tl, viewport: vp, textDivs: []}));
    }, {rootMargin: "600px"}).observe(div);
  }
  if (keepScroll) v.scrollTop = top;
}

async function loadAnnots() {
  state.annots = await api("/api/annots?id=" + encodeURIComponent(state.id));
  renderList();
}

/* ---------- sidebar ---------- */
function renderList() {
  const q = $("#q").value.trim().toLowerCase();
  const list = $("#list"); list.innerHTML = "";
  const items = state.annots
    .filter((a) => !q || (a.text + " " + a.note).toLowerCase().includes(q))
    .sort((a, b) => a.page - b.page || (a.rects[0]?.[1] ?? 0) - (b.rects[0]?.[1] ?? 0));
  if (!items.length) { list.innerHTML = `<div class="empty">${state.annots.length ? "No match." : "No highlights yet."}</div>`; return; }
  let page = 0;
  for (const a of items) {
    if (a.page !== page) { page = a.page; const h = document.createElement("div"); h.className = "pagehead"; h.textContent = "Page " + page; list.appendChild(h); }
    const c = document.createElement("div");
    c.className = "card"; c.id = "a" + a.xref; c.style.borderLeftColor = COLORS[a.color] || COLORS.yellow;
    const t = document.createElement("p"); t.className = "t"; t.textContent = a.text || "(no text)";
    const ta = document.createElement("textarea"); ta.placeholder = "Add a note…"; ta.value = a.note || "";
    ta.addEventListener("click", (e) => e.stopPropagation());
    ta.addEventListener("change", async () => { try { await post("PATCH", {id: state.id, page: a.page, xref: a.xref, note: ta.value}); a.note = ta.value; status("Note saved"); } catch (e) { status("Error: " + e.message); } });
    const acts = document.createElement("div"); acts.className = "acts";
    const dots = document.createElement("div"); dots.className = "dots";
    dotButtons(dots, async (col) => { try { await post("PATCH", {id: state.id, page: a.page, xref: a.xref, color: col}); await refresh(); } catch (e) { status("Error: " + e.message); } }, a.color);
    const sp = document.createElement("span"); sp.className = "sp";
    const del = document.createElement("button"); del.className = "del"; del.textContent = "Delete";
    del.addEventListener("click", async (e) => { e.stopPropagation(); if (!confirm("Delete this highlight?")) return;
      try { await api(`/api/annots?id=${encodeURIComponent(state.id)}&page=${a.page}&xref=${a.xref}`, {method: "DELETE"}); await refresh(); } catch (er) { status("Error: " + er.message); } });
    acts.append(dots, sp, del);
    c.append(t, ta, acts);
    c.addEventListener("click", () => jumpTo(a));
    list.appendChild(c);
  }
}

function jumpTo(a) {
  const div = state.pages[a.page]; if (!div) return;
  const r = a.rects[0] || [0, 0, 0, 0];
  const v = $("#viewer");
  v.scrollTo({top: div.offsetTop + r[1] * div.clientHeight - v.clientHeight / 3, behavior: "smooth"});
  for (const rc of a.rects) {
    const f = document.createElement("div"); f.className = "flashbox";
    f.style.left = rc[0] * 100 + "%"; f.style.top = rc[1] * 100 + "%";
    f.style.width = (rc[2] - rc[0]) * 100 + "%"; f.style.height = (rc[3] - rc[1]) * 100 + "%";
    div.appendChild(f); setTimeout(() => f.remove(), 1600);
  }
  document.querySelectorAll(".card.flash").forEach((e) => e.classList.remove("flash"));
  $("#a" + a.xref)?.classList.add("flash");
}

async function refresh() { // reload PDF (so the new highlight is drawn) and the list, keep scroll
  const buf = await (await fetch("/pdf?id=" + encodeURIComponent(state.id) + "&t=" + Date.now())).arrayBuffer();
  state.doc = await pdfjsLib.getDocument({data: buf}).promise;
  await renderAll(true); await loadAnnots();
}

/* ---------- creating highlights from the selection ---------- */
function selectionRects() {
  const sel = getSelection();
  if (!sel || sel.isCollapsed || !sel.rangeCount) return null;
  const range = sel.getRangeAt(0);
  const byPage = {};
  for (const rc of range.getClientRects()) {
    if (rc.width < 1 || rc.height < 1) continue;
    const cx = rc.left + rc.width / 2, cy = rc.top + rc.height / 2;
    const el = document.elementFromPoint(cx, cy);
    const div = el && el.closest && el.closest(".page") || [...document.querySelectorAll(".page")].find((p) => { const b = p.getBoundingClientRect(); return cx >= b.left && cx <= b.right && cy >= b.top && cy <= b.bottom; });
    if (!div) continue;
    const b = div.getBoundingClientRect();
    if (rc.height > b.height * 0.1) continue; // container boxes, not text lines
    const r = [(rc.left - b.left) / b.width, (rc.top - b.top) / b.height, (rc.right - b.left) / b.width, (rc.bottom - b.top) / b.height]
      .map((x) => Math.min(1, Math.max(0, x)));
    (byPage[div.dataset.page] ||= []).push(r);
  }
  for (const p in byPage) { // merge boxes on the same text line
    const rs = byPage[p].sort((a, b) => a[1] - b[1] || a[0] - b[0]), out = [];
    for (const r of rs) {
      const l = out[out.length - 1];
      if (l && Math.abs(l[1] - r[1]) < 0.004 && r[0] <= l[2] + 0.01) { l[0] = Math.min(l[0], r[0]); l[2] = Math.max(l[2], r[2]); l[1] = Math.min(l[1], r[1]); l[3] = Math.max(l[3], r[3]); }
      else if (!(l && r[0] >= l[0] - .001 && r[2] <= l[2] + .001 && r[1] >= l[1] - .004 && r[3] <= l[3] + .004)) out.push(r.slice());
    }
    byPage[p] = out;
  }
  return Object.keys(byPage).length ? byPage : null;
}

function showPop() {
  const pop = $("#pop"), sel = getSelection();
  if (!sel || sel.isCollapsed || !sel.rangeCount || !sel.anchorNode || !$("#viewer").contains(sel.anchorNode)) { pop.classList.remove("show"); return; }
  const b = sel.getRangeAt(0).getBoundingClientRect();
  pop.style.left = Math.max(8, b.left + b.width / 2 - 90) + "px";
  pop.style.top = Math.max(8, b.top - 44) + "px";
  dotButtons(pop, createHighlight, state.color);
  pop.classList.add("show");
}

async function createHighlight(color) {
  const byPage = selectionRects();
  if (!byPage) return;
  state.color = color; renderPalette();
  $("#pop").classList.remove("show");
  try {
    for (const p in byPage) await post("POST", {id: state.id, page: +p, rects: byPage[p], color, note: ""});
    getSelection().removeAllRanges();
    await refresh(); status("Highlight saved to the PDF");
  } catch (e) { status("Error: " + e.message); }
}

document.addEventListener("mouseup", () => setTimeout(showPop, 10));
document.addEventListener("keyup", (e) => { if (e.key === "Escape") { $("#pop").classList.remove("show"); getSelection().removeAllRanges(); } });
document.addEventListener("keydown", (e) => { // 1-5 = highlight with that colour
  if (e.target.matches && e.target.matches("input,textarea,select")) return;
  const n = "12345".indexOf(e.key); if (n >= 0 && getSelection() && !getSelection().isCollapsed) createHighlight(Object.keys(COLORS)[n]);
});

/* ---------- toolbar ---------- */
$("#file").addEventListener("change", (e) => openPdf(decodeURIComponent(e.target.value)));
$("#q").addEventListener("input", renderList);
$("#zin").onclick = () => { state.scale = Math.min(3, state.scale + 0.15); renderAll(true); };
$("#zout").onclick = () => { state.scale = Math.max(0.5, state.scale - 0.15); renderAll(true); };
$("#fit").onclick = async () => { const p = await state.doc.getPage(1); state.scale = ($("#viewer").clientWidth - 40) / p.getViewport({scale: 1}).width; renderAll(true); };
$("#exp").onclick = async () => {
  const md = await api("/api/export?id=" + encodeURIComponent(state.id));
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([md], {type: "text/markdown"}));
  a.download = ($("#file").selectedOptions[0].textContent.split("/").pop().replace(/\.pdf$/i, "")) + "-highlights.md"; a.click();
};

renderPalette();
loadFiles().catch((e) => status("Error: " + e.message));
</script>
</body>
</html>
